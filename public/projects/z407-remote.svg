<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070710"/>
      <stop offset="100%" stop-color="#141126"/>
    </linearGradient>
    <linearGradient id="dial-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  <rect x="25" y="25" width="750" height="400" rx="18" fill="#121020" stroke="#2a2444" stroke-width="1.5"/>

  <!-- Header -->
  <text x="55" y="68" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Logitech Z407 · Control Remoto BLE</text>
  <text x="55" y="88" fill="#94a3b8" font-family="monospace" font-size="12">Bluetooth Low Energy (GATT) · Volume &amp; Bass</text>
  <rect x="625" y="52" width="125" height="28" rx="14" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1"/>
  <text x="687" y="70" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">● CONECTADO</text>

  <!-- Dial Circle Center -->
  <circle cx="230" cy="245" r="115" fill="#17142a" stroke="#2a2444" stroke-width="3"/>
  <circle cx="230" cy="245" r="95" fill="none" stroke="#2a2444" stroke-width="12" stroke-linecap="round"/>
  <circle cx="230" cy="245" r="95" fill="none" stroke="url(#dial-glow)" stroke-width="12" stroke-dasharray="420" stroke-dashoffset="130" stroke-linecap="round"/>
  <text x="230" y="240" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="800" text-anchor="middle">68%</text>
  <text x="230" y="268" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">VOLUMEN MASTER</text>

  <!-- Right Controls Panel -->
  <!-- Bass Control -->
  <rect x="400" y="130" width="350" height="95" rx="14" fill="#17142b" stroke="#2b2548" stroke-width="1.5"/>
  <text x="425" y="160" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Nivel de Subwoofer (Graves)</text>
  <text x="715" y="160" fill="#22d3ee" font-family="monospace" font-size="14" font-weight="700" text-anchor="end">+4 dB</text>
  <rect x="425" y="180" width="295" height="12" rx="6" fill="#26213f"/>
  <rect x="425" y="180" width="195" height="12" rx="6" fill="url(#dial-glow)"/>

  <!-- Inputs Selection -->
  <rect x="400" y="245" width="350" height="130" rx="14" fill="#17142b" stroke="#2b2548" stroke-width="1.5"/>
  <text x="425" y="275" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Fuente de Entrada Activa</text>
  <!-- Buttons -->
  <rect x="425" y="295" width="90" height="55" rx="10" fill="#06b6d4" fill-opacity="0.2" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="470" y="325" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Bluetooth</text>
  <text x="470" y="340" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">Activo ✓</text>

  <rect x="525" y="295" width="90" height="55" rx="10" fill="#1f1a38" stroke="#322a57" stroke-width="1"/>
  <text x="570" y="328" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">AUX 3.5</text>

  <rect x="625" y="295" width="90" height="55" rx="10" fill="#1f1a38" stroke="#322a57" stroke-width="1"/>
  <text x="670" y="328" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">USB Audio</text>
</svg>